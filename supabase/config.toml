# Supabase CLI configuration for FoundIT.
# Local dev: `supabase start` · Deploy: see README "Backend setup".
project_id = "foundit"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
# Never use a bare "https://*.vercel.app/**" wildcard: it matches ANY Vercel
# project, so an attacker could receive auth tokens on their own subdomain.
# Replace the placeholders with the real production domain and the project's
# own preview pattern (https://<project>-*-<team>.vercel.app/**).
additional_redirect_urls = [
  "http://localhost:5173/**",
  "https://YOUR-PROD-DOMAIN.vercel.app/**",
  "https://YOUR-PROJECT-*-YOUR-TEAM.vercel.app/**",
]
jwt_expiry = 3600
enable_signup = true
# Server-side password policy (mirrors src/pages/auth/schemas.ts). Without
# this, anyone calling the Auth API directly can bypass the client checks.
minimum_password_length = 8
password_requirements = "lower_upper_letters_digits"

[auth.rate_limit]
# Per-IP limits, per hour unless noted, to slow brute force and email abuse.
email_sent = 4            # auth emails (verify / reset) per hour, project-wide
sms_sent = 30
sign_in_sign_ups = 30     # sign-in / sign-up attempts per 5 min per IP
token_verifications = 30  # OTP / magic-link verifications per 5 min per IP
token_refresh = 150       # per 5 min per IP
anonymous_users = 30

# CAPTCHA is off because the client does not send a captchaToken yet.
# To enable: add the Cloudflare Turnstile widget to the login, register and
# forgot-password pages, pass options.captchaToken to the Supabase calls,
# then set enabled = true and provide TURNSTILE_SECRET.
[auth.captcha]
enabled = false
provider = "turnstile"
secret = "env(TURNSTILE_SECRET)"

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
