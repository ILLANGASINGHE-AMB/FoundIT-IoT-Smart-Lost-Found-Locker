# Supabase CLI configuration for FoundIT.
# Local dev: `supabase start` · Deploy: see README "Backend setup".
project_id = "foundit"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "10MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
# Never use a bare "https://*.vercel.app/**" wildcard: it matches ANY Vercel
# project, so an attacker could receive auth tokens on their own subdomain.
# Replace the placeholders with the real production domain and the project's
# own preview pattern (https://<project>-*-<team>.vercel.app/**).
additional_redirect_urls = [
  "http://localhost:5173/**",
  "https://YOUR-PROD-DOMAIN.vercel.app/**",
  "https://YOUR-PROJECT-*-YOUR-TEAM.vercel.app/**",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
